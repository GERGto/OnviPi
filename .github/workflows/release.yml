name: Release

# Pushing a tag v* (e.g. "git tag v2.0 && git push origin v2.0") builds both
# installation methods and publishes a GitHub release:
#   onvipios-arm64.img.xz   OnviPiOS – ready-to-flash image
#   onvipi.tar.gz           package for an existing Raspberry Pi OS (install.sh)
# File names are fixed so that .../releases/latest/download/<file> always works.
# Release notes are generated by tools/release-notes.sh from CHANGELOG.md.
# A manual run (workflow_dispatch) only produces artifacts for testing, no release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      base_image_url:
        description: "Raspberry Pi OS Lite arm64 (.img.xz), empty = latest"
        required: false
        default: ""

permissions:
  contents: read

env:
  GO2RTC_VERSION: "1.9.9"

jobs:
  package:
    name: Package
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: ver
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then v="${GITHUB_REF_NAME#v}"; else v="0.0.0-dev+${GITHUB_SHA::7}"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: Check
        run: |
          for f in onvipi/install.sh onvipi/setup/*.sh image/build-image.sh tools/*.sh; do bash -n "$f"; done
          python3 -m py_compile onvipi/pi/*.py
          python3 -m unittest discover -s tests
      - name: Build package
        run: bash tools/package.sh "${{ steps.ver.outputs.version }}" dist
      - uses: actions/upload-artifact@v4
        with:
          name: package
          path: dist/onvipi.tar.gz
          retention-days: 7

  image:
    name: OnviPiOS image
    needs: package
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: package
          path: dist
      - name: Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xz-utils fdisk e2fsprogs jq zerofree
      - name: Build image
        env:
          BASE_IMAGE_URL: ${{ inputs.base_image_url }}
        run: |
          mkdir -p pkg && tar -C pkg -xzf dist/onvipi.tar.gz
          [ -n "$BASE_IMAGE_URL" ] || unset BASE_IMAGE_URL
          sudo --preserve-env=BASE_IMAGE_URL,GO2RTC_VERSION \
            bash image/build-image.sh pkg/onvipi out/onvipios-arm64.img.xz
          sudo cp build/base-image-url.txt out/
          sudo chown -R "$(id -u):$(id -g)" out
      - uses: actions/upload-artifact@v4
        with:
          name: image
          path: out/
          compression-level: 0
          retention-days: 7

  release:
    name: Publish release
    if: github.ref_type == 'tag'
    needs: [package, image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.package.outputs.version }}
        run: |
          BASE="$(cat assets/base-image-url.txt)"
          (cd assets && sha256sum onvipios-arm64.img.xz onvipi.tar.gz > SHA256SUMS)
          bash tools/release-notes.sh "$VERSION" "$GITHUB_REF_NAME" "$GITHUB_REPOSITORY" \
            "$BASE" "$GO2RTC_VERSION" > notes.md
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --title "OnviPi $VERSION" --notes-file notes.md --latest \
            assets/onvipios-arm64.img.xz assets/onvipi.tar.gz assets/SHA256SUMS
