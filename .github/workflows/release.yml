name: Release

# Tag v* pushen (z. B. "git tag v1.1 && git push origin v1.1") baut beide Wege und
# veröffentlicht ein GitHub-Release:
#   Weg A: picam-arm64.img.xz   fertiges Image zum Flashen
#   Weg B: picam.tar.gz         Paket für vorhandene Pis (install.sh)
# Feste Dateinamen, damit .../releases/latest/download/<datei> immer funktioniert.
# Die Release-Notes erzeugt tools/release-notes.sh aus CHANGELOG.md.
# Manuell gestartet (workflow_dispatch) entstehen nur Artefakte zum Testen, kein Release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      base_image_url:
        description: "Raspberry Pi OS Lite arm64 (.img.xz), leer = aktuelle Version"
        required: false
        default: ""

permissions:
  contents: read

env:
  GO2RTC_VERSION: "1.9.9"

jobs:
  package:
    name: Paket (Weg B)
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: ver
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then v="${GITHUB_REF_NAME#v}"; else v="0.0.0-dev+${GITHUB_SHA::7}"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: Prüfen
        run: |
          for f in picam/install.sh picam/setup/*.sh image/build-image.sh tools/*.sh; do bash -n "$f"; done
          python3 -m py_compile picam/pi/*.py
      - name: Paket bauen
        run: bash tools/package.sh "${{ steps.ver.outputs.version }}" dist
      - uses: actions/upload-artifact@v4
        with:
          name: package
          path: dist/picam.tar.gz
          retention-days: 7

  image:
    name: Image (Weg A)
    needs: package
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: package
          path: dist
      - name: Werkzeuge
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xz-utils fdisk e2fsprogs jq zerofree
      - name: Image bauen
        env:
          BASE_IMAGE_URL: ${{ inputs.base_image_url }}
          VERSION: ${{ needs.package.outputs.version }}
        run: |
          mkdir -p pkg && tar -C pkg -xzf dist/picam.tar.gz
          [ -n "$BASE_IMAGE_URL" ] || unset BASE_IMAGE_URL
          sudo --preserve-env=BASE_IMAGE_URL,GO2RTC_VERSION \
            bash image/build-image.sh pkg/picam out/picam-arm64.img.xz
          sudo cp build/base-image-url.txt out/
          sudo chown -R "$(id -u):$(id -g)" out
      - uses: actions/upload-artifact@v4
        with:
          name: image
          path: out/
          compression-level: 0
          retention-days: 7

  release:
    name: Release veröffentlichen
    if: github.ref_type == 'tag'
    needs: [package, image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Release anlegen
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.package.outputs.version }}
        run: |
          BASE="$(cat assets/base-image-url.txt)"
          (cd assets && sha256sum picam-arm64.img.xz picam.tar.gz > SHA256SUMS)
          bash tools/release-notes.sh "$VERSION" "$GITHUB_REF_NAME" "$GITHUB_REPOSITORY" \
            "$BASE" "$GO2RTC_VERSION" > notes.md
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --title "PiCam $VERSION" --notes-file notes.md --latest \
            assets/picam-arm64.img.xz assets/picam.tar.gz assets/SHA256SUMS
